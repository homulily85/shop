services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop
    environment:
      - DB_URL=jdbc:mariadb://db:3306/shop
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - PORT=12345
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  php-gateway:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: shop-php-gateway
    environment:
      - JAVA_HOST=app
      - JAVA_PORT=12345
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started

  db:
    container_name: shop-db
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis
    container_name: shop-redis
    restart: always

volumes:
  db_data: