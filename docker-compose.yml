services:
  shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop
    environment:
      - DB_URL=jdbc:mariadb://shop-db:3306/shop
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - PORT=12345
      - REDIS_HOST=shop-redis
      - REDIS_PORT=6379
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
      - MINIO_BUCKET_NAME=shop-bucket
      - MINIO_ENDPOINT=http://shop-minio:9000
    depends_on:
      shop-db:
        condition: service_healthy
      shop-redis:
        condition: service_started
      shop-minio:
        condition: service_started

  shop-php-gateway:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: shop-php-gateway
    environment:
      - JAVA_HOST=shop
      - JAVA_PORT=12345
    depends_on:
      shop:
        condition: service_started

  shop-db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
    ports:
      - "3306:3306"
    volumes:
      - shop_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./php:/usr/src/myapp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shop-php-gateway

  shop-redis:
    image: redis
    restart: always

  shop-minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    command: server /data
    volumes:
      - shop_minio_data:/data

volumes:
  shop_db_data:
  shop_minio_data: