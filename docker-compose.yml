services:
  shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop
    environment:
      - PORT=12345
      - SERVER_VAULT_URL=http://shop-vault:8200
      - VAULT_TOKEN=1
    depends_on:
      shop-db:
        condition: service_healthy
      shop-redis:
        condition: service_started
      shop-minio:
        condition: service_started
      shop-vault-init:
        condition: service_completed_successfully

  shop-php-gateway:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: shop-php-gateway
    environment:
      - JAVA_HOST=shop
      - JAVA_PORT=12345
      - REDIS_HOST=shop-redis
      - REDIS_PORT=6379
      - INTERNAL_API_SECRET=b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f
      - KONG_API_KEY=d4f8e2a1-7b3c-4f9e-a6d5-8c1b2e3f4a5d
    depends_on:
      shop:
        condition: service_started

  shop-db:
    image: mariadb
    restart: always
    container_name: shop-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
    volumes:
      - shop_db_data:/var/lib/mysql
      - ./db_schema.sql:/docker-entrypoint-initdb.d/schema.sql


    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  shop-nginx:
    image: nginx:alpine
    container_name: shop-nginx
    volumes:
      - ./php:/usr/src/myapp
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shop-php-gateway

  shop-redis:
    image: redis
    container_name: shop-redis
    restart: always

  shop-minio:
    image: minio/minio
    container_name: shop-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
    command: server /data
    volumes:
      - shop_minio_data:/data

  shop-vault:
    image: hashicorp/vault:1.21
    container_name: shop-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 1
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DISABLE_MLOCK: "true"
#    entrypoint: vault
    command: server -dev

  shop-vault-init:
    image: hashicorp/vault:1.21
    container_name: shop-vault-init
    environment:
      VAULT_ADDR: http://shop-vault:8200
      VAULT_TOKEN: 1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[vault-init] Waiting for Vault to be ready..."
        until vault status > /dev/null 2>&1; do
          echo "[vault-init] Vault not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "[vault-init] Vault is ready. Enabling KV v2 secrets engine..."
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        echo "[vault-init] Writing bank secrets..."
        vault kv put secret/shop \
          DB_URL="jdbc:mariadb://shop-db:3306/shop" \
          DB_USERNAME="root" \
          DB_PASSWORD="root" \
          REDIS_HOST="shop-redis" \
          REDIS_PORT="6379" \
          MINIO_ROOT_USER="admin" \
          MINIO_ROOT_PASSWORD="12345678" \
          MINIO_BUCKET_NAME="shop-bucket"\
          MINIO_ENDPOINT="http://shop-minio:9000" \
          SERVER_BANK_URL="http://bank-nginx" \
          INTERNAL_API_SECRET="b8f2a9c1-4e3d-4a7b-9f1e-6d5c8a2b3e4f"
        echo "[vault-init] Secrets written successfully."
    depends_on:
      - shop-vault

volumes:
  shop_db_data:
  shop_minio_data: